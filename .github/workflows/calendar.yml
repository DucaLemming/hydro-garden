name: Update Google Calendar

# Runs when the app saves the garden (push to garden-data), every morning, and on demand.
on:
  push:
    branches: [garden-data]
    paths: [garden.json]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendar
  cancel-in-progress: true

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/checkout@v4
        with: { ref: garden-data, path: data }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Bring the calendar in line with the plan
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          GARDEN_CALENDAR_ID: ${{ vars.GARDEN_CALENDAR_ID }}
          GARDEN_TZ: ${{ vars.GARDEN_TZ }}
        run: node tools/calendar-sync.mjs data/garden.json data/calendar-status.json
      - name: Record the result for the app
        if: always()
        run: |
          cd data
          git pull -q --rebase origin garden-data || true
          if [ -n "$(git status --porcelain calendar-status.json)" ]; then
            git config user.name "hydro-garden"
            git config user.email "actions@users.noreply.github.com"
            git add calendar-status.json
            git commit -qm "Calendar status"
            git push -q origin garden-data
          fi
